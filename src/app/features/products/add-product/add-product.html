<app-form-layout
  [title]="'product.add.title' | translate"
  [subtitle]="'product.add.description' | translate"
>
  <form
    id="add-product-form"
    form-content
    [formGroup]="form"
    class="add-product-form"
    (ngSubmit)="onSubmit()"
  >
    <!-- NAME -->

    <app-form-section>
      <app-form-field
        [label]="'product.name' | translate"
        [control]="form.controls.name"
        [messages]="messages.name"
        [submitted]="submitted()"
      >
        <app-form-input
          type="text"
          name="name"
          formControlName="name"
          [placeholder]="'product.name' | translate"
          [fullWidth]="true"
          class="add-product-input"
        />
      </app-form-field>
    </app-form-section>

    <!-- INGREDIENT TYPE -->

    <app-form-section>
      <app-form-field
        [label]="'form.label.ingredient_type' | translate"
        [control]="form.controls.ingredient_type"
        [messages]="messages.ingredient_type"
        [submitted]="submitted()"
      >
        <app-form-select
          name="ingredient_type"
          formControlName="ingredient_type"
          [options]="ingredientTypes()"
          [placeholder]="'form.label.ingredient_type' | translate"
        />
      </app-form-field>
    </app-form-section>
  </form>

  <div form-actions>
    <app-button type="button" variant="ghost" [fullWidth]="true" (click)="onCancel()">
      {{ 'common.cancel' | translate }}
    </app-button>
    <app-button
      type="submit"
      form="add-product-form"
      variant="primary"
      [disabled]="loading() || form.invalid"
      [loading]="loading()"
      [fullWidth]="true"
    >
      {{ loading() ? ('common.saving' | translate) : ('common.save' | translate) }}
    </app-button>
  </div>
</app-form-layout>
