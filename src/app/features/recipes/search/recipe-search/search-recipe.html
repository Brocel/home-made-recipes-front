<form class="advanced-search" (ngSubmit)="submit()" [formGroup]="form">
  <input
    formControlName="q"
    type="text"
    placeholder="{{ 'search.advancedSearchPlaceHolder' | translate }}"
  />
  <!-- TODO: champs additionnels à ajouter plus tard -->
  <button type="submit" class="btn btn-primary">{{ 'search.search' | translate }}</button>
</form>
