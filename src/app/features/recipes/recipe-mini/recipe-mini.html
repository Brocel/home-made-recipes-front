<div class="card">
  <section>
    <article>
      <div>
        <h3>{{ recipe?.title }}</h3>
        <span class="author">{{ 'recipe.author' | translate }} {{ recipe?.author }}</span>
      </div>
      <div>
        <p class="muted">{{ 'recipe.description' | translate }}: {{ recipe?.description }}</p>
        <span>{{ 'recipe.type' | translate }}: {{ recipe?.type }}</span>
        <span>{{ 'recipe.prepTime' | translate }}: {{ recipe?.preparationTime }}min</span>
      </div>
      <button>{{ 'recipe.show' | translate }}</button>
    </article>
  </section>
</div>
