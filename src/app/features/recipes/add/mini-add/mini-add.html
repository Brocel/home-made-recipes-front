<div class="mini-form">
  <h3 class="title">
    <mat-icon>add_box</mat-icon>
    {{ 'add.mini.title' | translate }}
  </h3>
  <form (ngSubmit)="submit()" [formGroup]="form" class="form">
    <!-- Nom de recette -->
    <mat-form-field appearance="outline" class="field">
      <mat-label>{{ 'recipe.title' | translate }}</mat-label>
      <mat-icon matPrefix>create</mat-icon>
      <input
        matInput
        formControlName="title"
        placeholder="{{ 'add.mini.namePlaceHolder' | translate }}"
      />
    </mat-form-field>

    <!-- Type de recette -->
    <mat-form-field appearance="outline" class="field">
      <mat-label>{{ 'recipe.type' | translate }}</mat-label>
      <mat-icon matPrefix>restaurant_menu</mat-icon>
      <mat-select formControlName="recipeType">
        <ng-container>
          @for (t of recipeTypes; track t.value) {
            <mat-option [value]="t.value"> {{ t.label | translate }} </mat-option>
          }
        </ng-container>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button class="submit">
      {{ 'add.create' | translate }}
    </button>
  </form>
</div>
