<div class="ingredients">
  @if (ingredientsControls.length === 0) {
    <p class="empty-state">{{ 'recipe.ingredients.empty' | translate }}</p>
  } @else {
    @for (group of ingredientsControls; let i = $index; track i) {
      <app-ingredient-row
        [group]="group"
        [submitted]="submitted()"
        (remove)="removeIngredient.emit(i)"
      />
    }
  }
</div>
