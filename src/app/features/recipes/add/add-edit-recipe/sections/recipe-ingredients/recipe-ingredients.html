<div class="ingredients">
  @for (group of ingredientsControls; let i = $index; track i) {
    <app-ingredient-row [group]="group" (remove)="removeIngredient(i)" />
  }

  <button mat-stroked-button type="button" (click)="addIngredient()">
    {{ 'glossary.recipe.ingredients.add' | translate }}
  </button>
</div>
