<div class="ingredient-row" [formGroup]="group()">
  <!-- QUANTITY -->
  <app-form-field
    [label]="'ingredient.quantity' | translate"
    [control]="group().controls['quantity']"
    [messages]="messages.quantity"
    [submitted]="submitted()"
    class="quantity-field"
  >
    <app-form-input
      type="number"
      name="quantity"
      formControlName="quantity"
      [placeholder]="'ingredient.quantity' | translate"
    />
  </app-form-field>

  <!-- UNIT -->
  <app-form-field
    [label]="'ingredient.unit' | translate"
    [control]="group().controls['unit']"
    [messages]="messages.unit"
    [submitted]="submitted()"
    class="unit-field"
  >
    <app-form-select
      name="unit"
      formControlName="unit"
      [options]="unitLabels()"
      [placeholder]="'ingredient.unit' | translate"
    />
  </app-form-field>

  <!-- PRODUCT -->
  <app-product-autocomplete
    class="product-field"
    formControlName="product"
    [label]="'ingredient.product' | translate"
  />

  <!-- DELETE BUTTON -->
  <app-button
    type="button"
    variant="ghost"
    icon="trash-2"
    [ariaLabel]="'common.delete' | translate"
    (click)="remove.emit()"
    class="delete-button"
  />
</div>
