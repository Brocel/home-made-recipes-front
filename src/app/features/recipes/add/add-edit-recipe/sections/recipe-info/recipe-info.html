<div [formGroup]="informations()" class="recipe-info">
  <!-- TITLE -->
  <app-form-section>
    <app-form-field
      [label]="'glossary.recipe.title' | translate"
      [control]="informations().controls['title']"
      [messages]="messages.title"
      [submitted]="submitted()"
    >
      <app-form-input
        type="text"
        name="title"
        formControlName="title"
        [placeholder]="'glossary.recipe.title' | translate"
      />
    </app-form-field>
  </app-form-section>

  <!-- DESCRIPTION -->
  <app-form-section>
    <app-form-field
      [label]="'recipe.description' | translate"
      [control]="informations().controls['description']"
      [messages]="messages.description"
      [submitted]="submitted()"
    >
      <app-form-textarea
        name="description"
        formControlName="description"
        [placeholder]="'recipe.description' | translate"
        [rows]="4"
      />
    </app-form-field>
  </app-form-section>

  <!-- PREPARATION TIME -->
  <app-form-section>
    <app-form-field
      [label]="'glossary.recipe.prepTimeMin' | translate"
      [control]="informations().controls['preparation_time']"
      [messages]="messages.preparation_time"
      [submitted]="submitted()"
    >
      <app-form-input
        type="number"
        name="preparation_time"
        formControlName="preparation_time"
        [placeholder]="'glossary.recipe.prepTimeMin' | translate"
      />
    </app-form-field>
  </app-form-section>

  <!-- RECIPE TYPE -->
  <app-form-section>
    <app-form-field
      [label]="'glossary.recipe.type' | translate"
      [control]="informations().controls['recipe_type']"
      [messages]="messages.recipe_type"
      [submitted]="submitted()"
    >
      <app-form-select
        name="recipe_type"
        formControlName="recipe_type"
        [options]="recipeTypes()"
        [placeholder]="'glossary.recipe.type' | translate"
      />
    </app-form-field>
  </app-form-section>
</div>
