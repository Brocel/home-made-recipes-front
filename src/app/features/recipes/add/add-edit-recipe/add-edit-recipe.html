<div class="add-edit-recipe">
  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <app-scroll-wrapper gap="md" padding="md">
        <!-- RECIPE INFO SECTION -->
        <app-recipe-info
          [informations]="informations"
          [submitted]="submitted()"
        />

        <!-- INGREDIENTS SECTION -->
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">{{ 'recipe.ingredients.title' | translate }}</h2>
            <app-button
              type="button"
              variant="secondary"
              icon="plus"
              (click)="onAddIngredient()"
            >
              {{ 'recipe.ingredients.add' | translate }}
            </app-button>
          </div>

          <app-recipe-ingredients
            [ingredients]="ingredient_list"
            [submitted]="submitted()"
            (removeIngredient)="onRemoveIngredient($event)"
            (addIngredient)="onAddIngredient()"
          />
        </div>

        <!-- STEPS SECTION -->
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">{{ 'recipe.steps.title' | translate }}</h2>
            <app-button
              type="button"
              variant="secondary"
              icon="plus"
              (click)="onAddStep()"
            >
              {{ 'recipe.steps.add' | translate }}
            </app-button>
          </div>

          <app-recipe-steps
            [steps]="step_list"
            [submitted]="submitted()"
            (removeStep)="onRemoveStep($event)"
          />
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
          <app-button
            type="submit"
            variant="primary"
            [disabled]="loading() || form.invalid"
            [loading]="loading()"
            [fullWidth]="true"
          >
            {{ 'common.save' | translate }}
          </app-button>
        </div>
      </app-scroll-wrapper>
    </form>
  </div>
</div>
