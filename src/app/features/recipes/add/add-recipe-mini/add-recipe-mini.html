<form class="add-recipe-mini" (ngSubmit)="submit()">
  <label>
    Titre
    <input [(ngModel)]="title" name="title" type="text" placeholder="Titre rapide" />
  </label>

  <label>
    Type
    <input [(ngModel)]="type" name="type" type="text" placeholder="Type (ex: dessert)" />
  </label>

  <app-button variant="primary" type="submit">Créer en détail</app-button>
</form>
