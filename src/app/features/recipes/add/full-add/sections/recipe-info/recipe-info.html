<div [formGroup]="informations" class="sub-form">
  <h3 class="title">
    <mat-icon>library_books</mat-icon>
    {{ 'add.info.title' | translate }}
  </h3>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ 'recipe.title' | translate }}</mat-label>
    <mat-icon matPrefix>create</mat-icon>
    <input matInput formControlName="title"/>
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ 'recipe.description' | translate }}</mat-label>
    <mat-icon matPrefix>create</mat-icon>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ 'recipe.prepTimeMin' | translate }}</mat-label>
    <mat-icon matPrefix>access_time</mat-icon>
    <input matInput type="number" formControlName="preparation_time" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ 'recipe.type' | translate }}</mat-label>
    <mat-select formControlName="recipe_type">
      @for (t of recipeTypes; track t.value) {
        <mat-option [value]="t.value">
          {{ t.label | translate }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
