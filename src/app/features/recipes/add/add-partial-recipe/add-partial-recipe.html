<app-form-layout [title]="'feature.recipes.add.mini.title' | translate">
  <form
    id="add-recipe-form"
    form-content
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="partial-recipe-form"
  >
    <!-- RECIPE TITLE -->
    <app-form-section>
      <app-form-field
        [label]="'glossary.recipe.title' | translate"
        [control]="form.controls.title"
        [messages]="messages.title"
        [submitted]="submitted()"
      >
        <app-form-input
          type="text"
          name="title"
          formControlName="title"
          [placeholder]="'add.mini.namePlaceHolder' | translate"
          [fullWidth]="true"
        />
      </app-form-field>
    </app-form-section>

    <!-- RECIPE TYPE -->
    <app-form-section>
      <app-form-field
        [label]="'glossary.recipe.type' | translate"
        [control]="form.controls.recipeType"
        [messages]="messages.recipe_type"
        [submitted]="submitted()"
      >
        <app-form-select
          name="recipeType"
          formControlName="recipeType"
          [options]="recipeTypes()"
          [placeholder]="'glossary.recipe.type' | translate"
        />
      </app-form-field>
    </app-form-section>
  </form>

  <div form-actions>
    <app-button
      type="submit"
      form="add-recipe-form"
      variant="primary"
      [disabled]="loading() || form.invalid"
      [loading]="loading()"
      [fullWidth]="true"
    >
      {{ 'add.create' | translate }}
    </app-button>
  </div>
</app-form-layout>
