<app-form-layout
  [title]="'feature.signin.login.title' | translate"
  [subtitle]="'feature.signin.login.description' | translate"
>
  <form id="login-form" form-content [formGroup]="form" class="login-form" (ngSubmit)="onSubmit()">
    <!-- EMAIL -->

    <app-form-section>
      <app-form-field
        [label]="'form.label.email' | translate"
        [control]="form.controls.email"
        [messages]="messages.email"
        [submitted]="submitted()"
      >
        <app-form-input
          type="email"
          name="email"
          formControlName="email"
          [placeholder]="'form.placeholder.email' | translate"
          [fullWidth]="true"
          class="login-input"
        />
      </app-form-field>
    </app-form-section>

    <!-- PASSWORD -->

    <app-form-section>
      <app-form-field
        [label]="'form.label.password' | translate"
        [control]="form.controls.password"
        [messages]="messages.password"
        [submitted]="submitted()"
      >
        <app-form-input
          type="password"
          name="password"
          formControlName="password"
          [fullWidth]="true"
          class="login-input"
        />
      </app-form-field>
    </app-form-section>
  </form>
  <div form-actions>
    <app-button
      type="submit"
      form="login-form"
      variant="primary"
      [disabled]="loading() || form.invalid"
      [loading]="loading()"
      [fullWidth]="true"
    >
      {{
        loading()
          ? ('feature.signin.login.spinner' | translate)
          : ('feature.signin.login.button' | translate)
      }}
    </app-button>
  </div>
</app-form-layout>

<div class="secondary">
  <span class="secondary__label">
    {{ 'feature.signin.login.register' | translate }}
  </span>

  <app-button type="button" variant="secondary" [fullWidth]="true" (click)="goToRegister()">
    {{ 'feature.signin.register.create' | translate }}
  </app-button>
</div>
