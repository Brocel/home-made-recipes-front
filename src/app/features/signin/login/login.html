<app-form-layout
  [title]="'login.title' | translate"
  [subtitle]="'login.description' | translate"
  [showActions]="true"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- EMAIL -->
    <app-form-section>
      <app-form-field
        [label]="'form.label.email' | translate"
        [error]="
          form.controls.email.touched && form.controls.email.invalid
            ? ('form.validation.email' | translate)
            : null
        "
      >
        <app-form-input type="email" formControlName="email" />
      </app-form-field>
    </app-form-section>

    <!-- PASSWORD -->
    <app-form-section>
      <app-form-field
        [label]="'form.label.password' | translate"
        [error]="
          form.controls.password.touched && form.controls.password.invalid
            ? ('form.validation.password' | translate)
            : null
        "
      >
        <app-form-input type="password" formControlName="password" />
      </app-form-field>
    </app-form-section>

    <!-- ACTIONS -->
    <div form-actions>
      <app-button
        type="submit"
        variant="primary"
        [disabled]="loading() || form.invalid"
        [loading]="loading()"
        [fullWidth]="true"
      >
        {{ loading() ? ('login.spinner' | translate) : ('login.button' | translate) }}
      </app-button>
    </div>
  </form>

  <!-- SECONDARY ACTION -->
  <div class="login-secondary">
    <span class="login-secondary__label">
      {{ 'feature.signin.login.register' | translate }}
    </span>

    <app-button type="button" variant="secondary" (click)="goToRegister()">
      {{ 'feature.signin.register.create' | translate }}
    </app-button>
  </div>
</app-form-layout>
