<app-form-layout [title]="'register.title' | translate">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- =========================
         IDENTITY SECTION
    ========================== -->
    <app-form-section [title]="'register.section.identity' | translate">
      <app-form-field
        [label]="'form.label.first_name' | translate"
        [error]="
          form.controls.first_name.touched && form.controls.first_name.invalid
            ? ('form.validation.first_name' | translate)
            : null
        "
      >
        <app-form-input type="text" formControlName="first_name" />
      </app-form-field>

      <app-form-field
        [label]="'form.label.last_name' | translate"
        [error]="
          form.controls.last_name.touched && form.controls.last_name.invalid
            ? ('form.validation.last_name' | translate)
            : null
        "
      >
        <app-form-input type="text" formControlName="last_name" />
      </app-form-field>

      <app-form-field
        [label]="'form.label.username' | translate"
        [error]="
          form.controls.username.hasError('usernameTaken')
            ? ('form.validation.username_taken' | translate)
            : form.controls.username.touched && form.controls.username.invalid
              ? ('form.validation.username' | translate)
              : null
        "
      >
        <app-form-input type="text" formControlName="username" />
      </app-form-field>
    </app-form-section>

    <!-- =========================
         CREDENTIALS SECTION
    ========================== -->
    <app-form-section [title]="'register.section.credentials' | translate">
      <app-form-field
        [label]="'form.label.email' | translate"
        [error]="
          form.controls.email.touched && form.controls.email.invalid
            ? ('form.validation.email' | translate)
            : null
        "
      >
        <app-form-input type="email" formControlName="email" />
      </app-form-field>

      <app-form-field
        [label]="'form.label.password' | translate"
        [error]="
          form.controls.password.touched && form.controls.password.invalid
            ? ('form.validation.password' | translate)
            : null
        "
      >
        <app-form-input type="password" formControlName="password" />
      </app-form-field>

      <app-form-field
        [label]="'form.label.confirm_password' | translate"
        [error]="
          form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid
            ? ('form.validation.confirm_password' | translate)
            : null
        "
      >
        <app-form-input type="password" formControlName="confirmPassword" />
      </app-form-field>
    </app-form-section>

    <!-- =========================
         META SECTION
    ========================== -->
    <app-form-section [title]="'register.section.meta' | translate">
      <app-form-field
        [label]="'form.label.birth_date' | translate"
        [error]="
          form.controls.birth_date.touched && form.controls.birth_date.invalid
            ? ('form.validation.birth_date' | translate)
            : null
        "
      >
        <app-form-input formControlName="birth_date" />
      </app-form-field>
    </app-form-section>

    <!-- =========================
         GLOBAL ERROR
    ========================== -->
    @if (errorKey()) {
      <div class="form-global-error">
        {{ errorKey() | translate }}
      </div>
    }

    <!-- =========================
         ACTIONS
    ========================== -->
    <div form-actions>
      <app-button
        type="submit"
        variant="primary"
        [disabled]="loading() || form.invalid"
        [loading]="loading()"
      >
        {{ loading() ? ('register.spinner' | translate) : ('register.create' | translate) }}
      </app-button>
    </div>
  </form>

  <!-- SUCCESS STATE -->
  @if (success()) {
    <div class="register-success">
      <h2>{{ 'register.success.title' | translate }}</h2>
      <p>{{ 'register.success.message' | translate }}</p>

      <app-button variant="primary" (click)="confirmSuccess()">
        {{ 'register.success.ok' | translate }}
      </app-button>
    </div>
  }
</app-form-layout>
