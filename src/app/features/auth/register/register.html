<div class="auth-page container">
  <h1>Inscription</h1>
  <p class="lead">Inscris-toi rapidement avec ton compte Google pour commencer à sauvegarder tes recettes.</p>

  <!-- Zone où Google rendra son bouton via google.accounts.id.renderButton -->
  <div id="google-register-button" class="mt-16" aria-label="Se connecter avec Google"></div>

  <div class="or-note">
    <span>Si tu as déjà un compte</span>
    <a (click)="goToLogin()"><app-button variant="outline">Se connecter</app-button></a>
  </div>

  <p class="privacy-note">
    En te connectant avec Google, nous utilisons uniquement les informations nécessaires pour créer ton compte.
  </p>
</div>
