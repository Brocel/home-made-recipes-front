<div class="auth-page container">
  <h1>{{ 'register.title' | translate }}</h1>
  <p class="lead">{{ 'register.description' | translate }}</p>

  <!-- Zone où Google rendra son bouton via google.accounts.id.renderButton -->
  <div id="google-register-button" class="mt-16" aria-label="{{ 'register.googleButton' | translate }}"></div>

  <div class="or-note">
    <span>{{ 'register.existingAccount' | translate }}</span>
    <a (click)="goToLogin()"><app-button variant="outline">{{ 'navbar.login' | translate }}</app-button></a>
  </div>

  <p class="privacy-note">
    {{ 'register.googlePrivacyNote' | translate }}
  </p>
</div>
