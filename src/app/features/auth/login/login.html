<div class="login-container">
  <h1>Connexion</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Email</label>
    <input type="email" formControlName="email" class="input" />

    @if (form.controls.email.invalid && form.controls.email.touched) {
      <span class="input-error">Email invalide</span>
    }

    <label>Mot de passe</label>
    <input type="password" formControlName="password" class="input" />

    @if (form.controls.password.invalid && form.controls.password.touched) {
      <span class="input-error">Mot de passe requis</span>
    }

    <button type="submit" [disabled]="loading() || form.invalid">
      @if (loading()) {
        <span>Connexion...</span>
      } @else {
        <span>Se connecter</span>
      }
    </button>
  </form>
  <div class="login-register-section">
    <h2>Première visite ?</h2>
    <button type="button" class="btn btn-secondary" (click)="goToRegister()">
      Créer un compte
    </button>
  </div>
</div>
