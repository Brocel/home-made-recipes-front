@for (item of modals(); track item.id) {
  <app-floating-surface
    [position]="position"
    [placement]="placement"
    [layer]="layer"
    [open]="true"
    [style.zIndex]="item.zIndex"
  >
    <div
      floatingContent
      class="modal-host"
      role="dialog"
      aria-modal="true"
      [ngClass]="getItemClasses(item)"
    >
      <!-- ============================================= -->
      <!-- Close button -->
      <!-- ============================================= -->
      <button
        class="modal-host__close"
        type="button"
        [aria-label]="'features.ux.modal-host.closeLabel' | translate"
        (click)="close(item.id)"
      >
        <span aria-hidden="true">✕</span>
      </button>

      <!-- ============================================= -->
      <!-- Modal content -->
      <!-- ============================================= -->
      <div class="modal-host__content">
        @switch (item.config.type) {
          @case ('login') {
            <app-login [loginData]="getData(item)" (successfulLogin)="onLoginSuccess()" />
          }

          @case ('register') {
            <app-register (successfulRegister)="onRegisterSuccess($event)" />
          }

          @case ('profile') {
            <app-profile />
          }

          @case ('confirm') {
            <app-confirm-popup
              [data]="getData(item)"
              (confirmed)="onConfirm($event)"
              (cancelled)="onCancel()"
            />
          }
        }
      </div>
    </div>
  </app-floating-surface>
}
