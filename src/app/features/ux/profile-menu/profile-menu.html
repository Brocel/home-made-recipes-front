<app-floating-surface [position]="position" [layer]="layer" [open]="open()">
  <!-- ===================================================== -->
  <!-- Trigger -->
  <!-- ===================================================== -->
  <button floatingTrigger class="profile-trigger" type="button" (click)="toggle()">
    @if (userProfile()?.avatar) {
      <img
        [src]="userProfile()?.avatar"
        alt=""
        class="avatar"
        [aria-label]="'feature.ux.profile-menu.user.label' | translate"
      />
    } @else {
      <img
        src="assets/default_avatar.png"
        alt=""
        class="avatar"
        [aria-label]="'feature.ux.profile-menu.guest.label' | translate"
      />
    }
  </button>

  <!-- ===================================================== -->
  <!-- Content -->
  <!-- ===================================================== -->
  <div floatingContent class="profile-panel">
    @if (isAuthenticated()) {
      <button
        class="profile-item"
        (click)="onProfile()"
        [aria-label]="'feature.ux.profile-menu.user.label' | translate"
      >
        {{ 'feature.ux.profile-menu.user.label' | translate }}
      </button>

      <button
        class="profile-item"
        (click)="onDashboard()"
        [aria-label]="'feature.ux.profile-menu.user.dashboard' | translate"
      >
        {{ 'feature.ux.profile-menu.user.dashboard' | translate }}
      </button>

      <div class="profile-divider"></div>

      <button
        class="profile-item danger"
        (click)="onLogout()"
        [aria-label]="'feature.ux.profile-menu.user.logout' | translate"
      >
        {{ 'feature.ux.profile-menu.user.logout' | translate }}
      </button>
    } @else {
      <button
        class="profile-item"
        (click)="onLogin()"
        [aria-label]="'feature.ux.profile-menu.guest.login' | translate"
      >
        {{ 'feature.ux.profile-menu.guest.login' | translate }}
      </button>
    }
  </div>
</app-floating-surface>
