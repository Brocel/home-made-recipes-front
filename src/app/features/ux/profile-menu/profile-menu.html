<app-floating-surface [position]="position" [layer]="layer" [tone]="tone" [open]="open()">
  <!-- ===================================================== -->
  <!-- Trigger -->
  <!-- ===================================================== -->
  <button floatingTrigger class="profile-trigger" type="button" (click)="toggle()">
    @if (user()?.picture) {
      <img [src]="user()?.picture" [alt]="user()?.username || 'User'" class="avatar" />
    } @else {
      <img src="assets/default_avatar.png" alt="Avatar" class="avatar" />
    }
  </button>

  <!-- ===================================================== -->
  <!-- Content -->
  <!-- ===================================================== -->
  <div floatingContent class="profile-panel">
    @if (isAuthenticated()) {
      <button class="profile-item" (click)="onProfile()">
        {{ 'feature.ux.menu.profile.user.label' | translate }}
      </button>

      <button class="profile-item" (click)="onDashboard()">
        {{ 'feature.ux.menu.profile.user.dashboard' | translate }}
      </button>

      <div class="profile-divider"></div>

      <button class="profile-item danger" (click)="onLogout()">
        {{ 'feature.ux.menu.profile.user.logout' | translate }}
      </button>
    } @else {
      <button class="profile-item" (click)="onLogin()">
        {{ 'feature.ux.menu.profile.guest.login' | translate }}
      </button>
    }
  </div>
</app-floating-surface>
