<app-floating-surface position="anchored" strategy="click" layer="dropdown">
  <!-- ===================================================== -->
  <!-- Trigger -->
  <!-- ===================================================== -->
  <button floatingTrigger class="profile-trigger" type="button" aria-haspopup="menu">
    @if (user()?.picture) {
      <img [src]="user()?.picture" [alt]="user()?.username || 'User'" class="avatar" />
    } @else {
      <img src="assets/default_avatar.png" alt="Avatar" class="avatar" />
    }
  </button>

  <!-- ===================================================== -->
  <!-- Content -->
  <!-- ===================================================== -->
  <div floatingContent class="profile-panel">
    @if (isAuthenticated()) {
      <button class="profile-item" (click)="onProfile()" floatingCloseItem>
        {{ 'feature.ux.menu.profile.user.label' | translate }}
      </button>

      <button class="profile-item" (click)="onDashboard()" floatingCloseItem>
        {{ 'feature.ux.menu.profile.user.dashboard' | translate }}
      </button>

      <div class="profile-divider"></div>

      <button class="profile-item danger" (click)="onLogout()" floatingCloseItem>
        {{ 'feature.ux.menu.profile.user.logout' | translate }}
      </button>
    } @else {
      <button class="profile-item" (click)="onLogin()" floatingCloseItem>
        {{ 'feature.ux.menu.profile.guest.login' | translate }}
      </button>
    }
  </div>
</app-floating-surface>
