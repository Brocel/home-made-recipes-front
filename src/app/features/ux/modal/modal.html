@if (isOpen()) {
  <app-floating-surface
    [position]="position"
    [placement]="placement"
    [layer]="layer"
    [variant]="variant"
    [tone]="tone"
    [open]="isOpen()"
    (clickOutside)="close()"
  >
    <div floatingContent class="modal-host">
      <!-- ============================================= -->
      <!-- Close button -->
      <!-- ============================================= -->
      <button class="modal-host__close" type="button" aria-label="Close modal" (click)="close()">
        ✕
      </button>

      <!-- ============================================= -->
      <!-- Modal content -->
      <!-- ============================================= -->
      <div class="modal-host__content">
        @switch (type()) {
          @case ('login') {
            <app-login [prefillEmail]="loginData().email" (successfulLogin)="onLoginSuccess()" />
          }

          @case ('register') {
            <app-register (successfulRegister)="onRegisterSuccess($event)" />
          }

          @case ('profile') {
            <app-profile />
          }
        }
      </div>
    </div>
  </app-floating-surface>
}
