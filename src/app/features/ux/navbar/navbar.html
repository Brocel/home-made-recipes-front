<nav class="navbar container">
  <!-- LEFT -->
  <div class="left">
    <app-left-menu
      (openHome)="goHome()"
      (openAdvancedSearch)="goToAdvancedSearch($event)"
      (openAddRecipe)="goToAddRecipe()"
    >
    </app-left-menu>
  </div>

  <mat-divider vertical></mat-divider>

  <!-- CENTER -->
  <div class="center">
    <section class="title">
      <h1>{{ 'home.title' | translate }}</h1>
      <p class="lead">{{ 'home.lead' | translate }}</p>
    </section>
    <div class="search-inline">
      <app-quick-search placeholder="{{ 'search.placeholder' | translate }}"></app-quick-search>
    </div>
  </div>

  <mat-divider vertical></mat-divider>

  <!-- RIGHT -->
  <div class="right">
    <!-- bouton de langue lié au LanguageService -->
    <button
      class="btn"
      type="button"
      (click)="toggleLang()"
      [attr.aria-label]="'navbar.langLabel' | translate"
      [attr.aria-pressed]="lang.current() === 'pt-BR'"
    >
      {{ lang.current() === 'fr' ? 'FR' : 'BR' }}
    </button>

    <mat-divider inset vertical></mat-divider>

    <!-- PROFILE MENU -->
    <app-profile-menu
      [user]="user"
      [isAuthenticated]="isAuthenticated"
      (openLogin)="goLogin()"
      (openProfile)="goProfile()"
      (signOut)="signOut()"
    >
    </app-profile-menu>
  </div>
</nav>
