<nav class="navbar">
  <button type="button" class="navbar__brand" (click)="goHome()">
    <img [src]="logoUrl" alt="" class="navbar__logo" />
    <div class="navbar__titles">
      <h1 class="navbar__title">{{ 'feature.home.title' | translate }}</h1>
      <p class="navbar__lead">{{ 'feature.home.lead' | translate }}</p>
    </div>
  </button>

  <section class="navbar__actions">
    <div class="lang-switch">
      <button
        class="lang-switch__option"
        [class.is-active]="currentLang() === 'fr'"
        (click)="setLang('fr')"
      >
        FR
      </button>

      <button
        class="lang-switch__option"
        [class.is-active]="currentLang() === 'pt-BR'"
        (click)="setLang('pt-BR')"
      >
        BR
      </button>
    </div>

    <app-profile-menu
      [user]="user()"
      [isAuthenticated]="isAuthenticated()"
      (login)="goLogin()"
      (profile)="goProfile()"
      (dashboard)="goDashboard()"
      (logout)="signOut()"
    >
    </app-profile-menu>
  </section>
</nav>
