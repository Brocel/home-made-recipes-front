<app-side-drawer
  [position]="position"
  [open]="isOpen()"
  width="500px"
  (openChange)="isOpen.set($event)"
  (clickOutside)="close()"
>
  <div class="panel-content">
    <app-scroll-wrapper gap="xs" padding="md">
      <app-mini-search (search)="onMiniSearch($event)" />

      <app-mini-add />
    </app-scroll-wrapper>
  </div>
</app-side-drawer>
