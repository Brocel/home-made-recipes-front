<div class="auth-cta">
  <h3>{{ 'authCta.title' | translate }}</h3>
  <p>{{ 'authCta.description' | translate }}</p>
  <div class="actions">
    <app-button variant="outline" (pressed)="openLogin.emit()">{{ 'navbar.login' | translate }}</app-button>
    <app-button variant="primary" (pressed)="openRegister.emit()">{{ 'navbar.register' | translate }}</app-button>
  </div>
</div>
