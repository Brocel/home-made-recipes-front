<div class="home-page">
  <app-navbar
    [user]="user()"
    [isAuthenticated]="auth()"
    (changeLang)="console.log('lang', $event)"
    (openLogin)="console.log('open login')"
    (openRegister)="console.log('open register')"
    (addRecipe)="console.log('add recipe')"
  ></app-navbar>

  <div class="home-layout container">
    <aside class="left-col">
      <search-quick (search)="onSearch($event)"></search-quick>
    </aside>

    <main class="main-col">
      <section class="hero">
        <h1>Home Made Recipes</h1>
        <p class="lead">Recettes maison simples et savoureuses.</p>

        <ng-container *ngIf="auth(); else visitorSearch">
          <search-advanced (submitAdvanced)="onAdvancedSearch($event)"></search-advanced>
        </ng-container>

        <ng-template #visitorSearch>
          <search-quick (search)="onSearch($event)"></search-quick>
        </ng-template>
      </section>

      <section class="recent">
        <h2>Recettes récentes</h2>
        <div *ngIf="loading()" class="loading">Chargement...</div>
        <div *ngIf="error()" class="error">{{ error() }}</div>

        <ul class="grid" *ngIf="!loading() && recipes().length">
          <li *ngFor="let r of recipes()">
            <article class="card">
              <h3>{{ r.title }}</h3>
              <p class="muted">{{ r.description }}</p>
              <a [routerLink]="['/recipes', r.id]">Voir</a>
            </article>
          </li>
        </ul>
      </section>
    </main>

    <aside class="right-col">
      <ng-container *ngIf="auth(); else cta">
        <add-recipe-mini (openCreateFull)="onOpenCreateFull($event)"></add-recipe-mini>
      </ng-container>

      <ng-template #cta>
        <auth-call-to-action
          (openLogin)="console.log('open login')"
          (openRegister)="console.log('open register')"
        ></auth-call-to-action>
      </ng-template>
    </aside>
  </div>

  <footer class="site-footer">
    <!-- footer placeholder -->
  </footer>
</div>
