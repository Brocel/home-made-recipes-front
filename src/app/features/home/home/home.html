<div class="home-page">
  <div class="home-layout container">
    <aside class="left-col" aria-label="{{ 'navbar.searchPlaceholder' | translate }}">
      <quick-search
        (search)="onSearch($event)"
        placeholder="{{ 'recipe.title' | translate }}"
      ></quick-search>
      <quick-search
        (search)="onSearch($event)"
        placeholder="{{ 'recipe.type' | translate }}"
      ></quick-search>
      <quick-search
        (search)="onSearch($event)"
        placeholder="{{ 'recipe.prepTimeMin' | translate }}"
      ></quick-search>
      <quick-search
        (search)="onSearch($event)"
        placeholder="{{ 'recipe.ingredientType' | translate }}"
      ></quick-search>
    </aside>

    <main class="main-col">
      <section>
        <h2 class="title">{{ 'home.dailyRecipe' | translate }}</h2>
        @if (loading()) {
        <mat-spinner aria-label="{{ 'common.loading' | translate }}"> </mat-spinner>
        } @else {
        <div class="daily">
          <app-recipe-mini [recipe]="dailyRecipe()"> </app-recipe-mini>
        </div>
        } @if (errorMessage()) {
        <div class="error">{{ errorMessage() }}</div>
        }
      </section>
    </main>

    <aside class="right-col" aria-label="{{ 'recipe.addRecipe' | translate }}">
      <add-recipe-mini (openCreateFull)="onOpenCreateFull($event)"></add-recipe-mini>
    </aside>
  </div>
</div>
