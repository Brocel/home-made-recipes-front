<div class="home-page">
  <div class="home-container">
    <div class="main-content">
      <section class="daily-section">
        <h1 class="title">{{ 'home.dailyRecipe' | translate }}</h1>

        <div class="daily-content">
          @if (loading()) {
            <mat-spinner aria-label="{{ 'common.loading' | translate }}"> </mat-spinner>
          } @else {
            <app-recipe-full [recipe]="dailyRecipe()"> </app-recipe-full>
          }

          @if (errorMessage()) {
            <div class="error">{{ errorMessage() }}</div>
          }
        </div>
      </section>
    </div>
  </div>
</div>
