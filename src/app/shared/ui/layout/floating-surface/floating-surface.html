<div
  class="floating"
  [ngClass]="classes()"
  [ngStyle]="styles()"
  appHoverExpand
  (hovered)="setOpen($event)"
  appClickOutside
  (clickOutside)="close()"
>
  <!-- Trigger -->
  <div class="floating__trigger" (click)="toggle()">
    <ng-content select="[floatingTrigger]"></ng-content>
  </div>

  <!-- Surface -->
  @if (open()) {
    <div class="floating__surface">
      <ng-content select="[floatingContent]"></ng-content>
    </div>
  }
</div>
