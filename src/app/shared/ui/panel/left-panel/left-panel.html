<div class="panel" [class.open]="isOpen()">
  <div class="panel-content">
    <app-mini-search (search)="onMiniSearch($event)" (close)="toggle()"> </app-mini-search>

    <app-add-recipe-mini (openCreateFull)="onOpenCreateFull($event)" (close)="toggle()">
    </app-add-recipe-mini>
  </div>

  <button class="handle" (click)="toggle()">
    <span class="chevron" [class.open]="isOpen()">›</span>
  </button>
</div>
