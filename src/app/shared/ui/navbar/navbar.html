<nav class="navbar container">
  <!-- LEFT -->
  <div class="left">
    <app-left-menu (openHome)="goHome()"
                   (openAdvancedSearch)="goToAdvancedSearch($event)"
                   (openAddRecipe)="goToAddRecipe()">
    </app-left-menu>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="search-inline">
      <quick-search></quick-search>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <!-- bouton de langue lié au LanguageService -->
    <button
      class="lang-btn"
      type="button"
      (click)="toggleLang()"
      [attr.aria-label]="'navbar.langLabel' | translate"
      [attr.aria-pressed]="lang.current() === 'pt-BR'">
      {{ lang.current() === 'fr' ? 'FR' : 'pt-BR' }}
    </button>

    <!-- PROFILE MENU -->
    <app-profile-menu [user]="user"
                      [isAuthenticated]="isAuthenticated"
                      (openLogin)="goLogin()"
                      (openProfile)="goProfile()"
                      (signOut)="signOut()">
    </app-profile-menu>
  </div>
</nav>
