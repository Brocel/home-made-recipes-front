<nav class="navbar container">
  <!-- LEFT -->
  <div class="left">
    <button class="menu-btn" aria-label="{{ 'navbar.menuLabel' | translate }}">☰</button>
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="search-inline">
      <input
        type="search"
        placeholder="{{ 'navbar.searchPlaceholder' | translate }}"
        aria-label="{{ 'navbar.searchPlaceholder' | translate }}" />
      <app-button variant="ghost">OK</app-button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <!-- bouton de langue lié au LanguageService -->
    <button
      class="lang-btn"
      type="button"
      (click)="toggleLang()"
      [attr.aria-label]="'navbar.langLabel' | translate"
      [attr.aria-pressed]="lang.current() === 'pt-BR'">
      {{ lang.current() === 'fr' ? 'FR' : 'PT' }}
    </button>

    <!-- état authentifié -->
    @if (isAuthenticated) {
      <ng-container>
        <!-- bouton profil / avatar -->
        <button
          class="profile-btn"
          (click)="onProfileClick()"
          aria-label="{{ 'navbar.profile' | translate }}">
          @if (user?.picture) {
            <img [src]="user.picture" alt="avatar" class="avatar" />
          } @else {
            <span aria-hidden="true">👤</span>
          }
        </button>
      </ng-container>
    } @else {
      <!-- invité -->
      <ng-template>
        <button class="profile-btn" (click)="openLogin.emit()" aria-label="{{ 'navbar.profile' | translate }}">
          👤
        </button>
      </ng-template>
    }
  </div>

  <!-- PROFILE MENU (rendered conditionally, géré par le component TS) -->
  @if (profileMenuOpen) {
    <div
      class="profile-menu"
      role="menu"
      tabindex="-1"
      aria-label="{{ isAuthenticated ? ('navbar.profileMenu' | translate) : ('navbar.guestMenu' | translate) }}">
      @if (isAuthenticated) {
        <ng-container>
          <profile-menu (close)="closeProfileMenu()" [user]="user"></profile-menu>
        </ng-container>
      } @else {
        <ng-template #guestMenu>
          <button role="menuitem" type="button" (click)="onLoginClick()">
            {{ 'navbar.login' | translate }}
          </button>
          <button role="menuitem" type="button" (click)="onRegisterClick()">
            {{ 'navbar.register' | translate }}
          </button>
        </ng-template>
      }
    </div>
  }
</nav>
