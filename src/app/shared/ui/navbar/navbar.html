<nav class="navbar container">
  <!-- left / center omitted for concision -->

  <div class="right">
    <button
      class="lang-btn"
      type="button"
      (click)="toggleLang()"
      [attr.aria-label]="'navbar.langLabel' | translate"
      [attr.aria-pressed]="lang.current() === 'pt-BR'">
      {{ lang.current() === 'fr' ? 'FR' : 'PT' }}
    </button>

    <div class="profile-wrapper"
         style="position:relative;">
      <button
        class="profile-btn"
        type="button"
        (click)="onProfileClick()"
        [attr.aria-expanded]="profileMenuOpen"
        [attr.aria-haspopup]="true"
        [attr.aria-label]="'navbar.profile' | translate">
        @if (user?.picture) {
          <img [src]="user.picture"
               [alt]="'navbar.profileAlt' | translate"
               class="avatar"/>
        } @else {
          <span aria-hidden="true">👤</span>
        }
      </button>

      @if (profileMenuOpen) {
        <div
          class="profile-menu"
          role="menu"
          aria-label="{{ isAuthenticated ? ('navbar.profileMenu' | translate) : 'navbar.guestMenu' | translate }}"
          tabindex="-1">
          <!-- Authenticated menu -->
          @if (isAuthenticated) {
            <ng-container>
              <!-- Lazy loadable advanced menu component -->
              <profile-menu (close)="closeProfileMenu()"
                                [user]="user">
              </profile-menu>
            </ng-container>
          } @else {
            <!-- Guest menu -->
            <ng-template #guestMenu>
              <button role="menuitem"
                      type="button"
                      (click)="onLoginClick()">
                {{ 'navbar.login' | translate }}
              </button>
              <button role="menuitem"
                      type="button"
                      (click)="onRegisterClick()">
                {{ 'navbar.register' | translate }}
              </button>
            </ng-template>
          }
        </div>
      }
    </div>
  </div>
</nav>
