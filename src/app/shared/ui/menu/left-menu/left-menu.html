<div class="left-menu-root">
  <!-- Trigger button -->
  <button
    class="menu-btn"
    mat-icon-button
    [matMenuTriggerFor]="mainMenu"
    aria-label="{{ 'menu.label' | translate }}"
    disableRipple
  >
    ☰
  </button>

  <!-- Menu -->
  <mat-menu #mainMenu="matMenu" class="menu-panel">
    <button mat-menu-item #homeEl (mouseenter)="homeEl.focus()" (click)="goHome()">
      <span class="label">{{ 'menu.left.home' | translate }}</span>
    </button>

    <button mat-menu-item #searchEl (mouseenter)="searchEl.focus()" (click)="goAdvancedSearch()">
      <span class="label">{{ 'menu.left.search' | translate }}</span>
    </button>

    <button mat-menu-item #addEl (mouseenter)="addEl.focus()" (click)="goAddRecipe()">
      <span class="label">{{ 'menu.left.addRecipe' | translate }}</span>
    </button>
  </mat-menu>
</div>
