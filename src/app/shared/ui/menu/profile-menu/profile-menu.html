<div class="profile-menu-root">
  <!-- Trigger button -->
  <button
    class="btn btn-secondary profile-btn"
    mat-icon-button
    [matMenuTriggerFor]="profileMenu"
    aria-label="{{ 'menu.profile.label' | translate }}"
  >
    @if (user?.picture) {
      <img [src]="user.picture" alt="{{ user?.name || 'User' }}" class="avatar" />
    } @else {
      <span class="avatar-fallback" aria-hidden="true">👤</span>
    }
  </button>

  <!-- Menu -->
  <mat-menu #profileMenu="matMenu" class="profile-menu-panel">
    @if (isAuthenticated) {
      <button
        mat-menu-item
        #profileEl
        (mouseenter)="profileEl.focus()"
        (click)="openProfileClick()"
        [attr.aria-label]="'menu.profile.user.label' | translate"
      >
        <span class="label">
          {{ 'menu.profile.user.label' | translate }}
        </span>
      </button>

      <button
        mat-menu-item
        #dashboardEl
        (mouseenter)="dashboardEl.focus()"
        (click)="openDashboardClick()"
        [attr.aria-label]="'menu.profile.user.dashboard' | translate"
      >
        <span class="label">
          {{ 'menu.profile.user.dashboard' | translate }}
        </span>
      </button>

      <mat-divider></mat-divider>

      <button
        mat-menu-item
        #logoutEl
        (mouseenter)="logoutEl.focus()"
        (click)="signOutClick()"
        [attr.aria-label]="'menu.profile.user.logout' | translate"
      >
        <span class="label">
          {{ 'menu.profile.user.logout' | translate }}
        </span>
      </button>
    } @else {
      <button
        mat-menu-item
        #loginEl
        (mouseenter)="loginEl.focus()"
        (click)="openLoginClick()"
        [attr.aria-label]="'menu.profile.guest.login' | translate"
      >
        <span class="label">
          {{ 'menu.profile.guest.login' | translate }}
        </span>
      </button>
    }
  </mat-menu>
</div>
