<form class="form-layout">
  <header class="form-layout__header">
    @if (title()) {
      <h2 class="form-layout__title">
        {{ title() }}
      </h2>
    }

    @if (subtitle()) {
      <p class="form-layout__subtitle">
        {{ subtitle() }}
      </p>
    }
  </header>

  <div [ngClass]="contentClasses()">
    <ng-content />
  </div>

  @if (showActions()) {
    <footer class="form-layout__actions">
      <ng-content select="[form-actions]" />
    </footer>
  }
</form>
