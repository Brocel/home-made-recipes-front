@if (isOpen()) {
  <app-floating-surface
    [position]="position"
    [placement]="placement"
    [layer]="layer"
    [strategy]="strategy"
    [variant]="variant"
    [tone]="tone"
    [open]="isOpen()"
    (openChange)="close()"
  >
    <div floatingContent class="modal-host__content">
      @switch (type()) {
        @case ('login') {
          <app-login [prefillEmail]="loginData().email" />
        }

        @case ('register') {
          <app-register />
        }
      }
    </div>
  </app-floating-surface>
}
