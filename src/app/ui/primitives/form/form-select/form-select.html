<select
  [value]="_value() ?? ''"
  [disabled]="_disabled()"
  [ngClass]="classes()"
  (change)="onChangeValue($event)"
  (blur)="markAsTouched()"
>
  @if (placeholder()) {
    <option value="" disabled selected>
      {{ placeholder() }}
    </option>
  }

  @for (option of options(); track option.value) {
    <option [value]="option.value" [aria-label]="option.label">
      {{ option.label }}
    </option>
  }
</select>
