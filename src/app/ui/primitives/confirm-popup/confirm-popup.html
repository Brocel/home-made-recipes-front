<div [ngClass]="classes()">
  <!-- ============================================= -->
  <!-- Icon -->
  <!-- ============================================= -->
  <div class="confirm__icon">
    {{ icon() }}
  </div>

  <!-- ============================================= -->
  <!-- Content -->
  <!-- ============================================= -->
  <div class="confirm__body">
    <h2 class="confirm__title">
      {{ data().title }}
    </h2>

    <p class="confirm__message">
      {{ message() }}
    </p>
  </div>

  <!-- ============================================= -->
  <!-- Actions -->
  <!-- ============================================= -->
  <div class="confirm__actions">
    <app-button variant="ghost" (click)="cancelled.emit()">
      {{ cancelLabel() }}
    </app-button>

    <app-button [variant]="variant()" (click)="confirmed.emit(data().actionData)">
      {{ confirmLabel() }}
    </app-button>
  </div>
</div>
