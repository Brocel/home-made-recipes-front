<div [ngClass]="classes()">
  <!-- ============================================= -->
  <!-- Header -->
  <!-- ============================================= -->
  <div class="confirm__header">
    <div class="confirm__header-left">
      <div class="confirm__icon">
        {{ icon() }}
      </div>

      <h2 class="confirm__title">
        {{ title() }}
      </h2>
    </div>
  </div>

  <!-- ============================================= -->
  <!-- Body -->
  <!-- ============================================= -->
  <div class="confirm__body">
    <p class="confirm__message">
      {{ message() }}
    </p>
  </div>

  <!-- ============================================= -->
  <!-- Actions -->
  <!-- ============================================= -->
  <div class="confirm__actions">
    <app-button variant="ghost" (click)="cancelled.emit()">
      {{ cancelLabel() }}
    </app-button>

    <app-button [variant]="variant()" (click)="confirmed.emit(actionData())">
      {{ confirmLabel() }}
    </app-button>
  </div>
</div>
